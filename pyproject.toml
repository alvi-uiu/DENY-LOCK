[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denylock"
version = "0.1.0"
description = "Deterministic post-denial policy persistence and RouteAroundBench"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
test = ["pytest>=8.0"]

[project.scripts]
denylock = "denylock.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
